<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms | Exam Seating Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Exam Seating Management System</h1>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="departments.html">Departments</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="rooms.html" class="active">Rooms</a></li>
            <li><a href="seating-plan.html">Seating Plan</a></li>
            <li><a href="export.html">Export</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <section class="page-content">
            <h2>Manage Rooms</h2>
            <table id="roomsTable">
                <thead>
                    <tr>
                        <th>Room Number</th>
                        <th>Building</th>
                        <th>Capacity</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rooms rows will be dynamically populated here -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Exam Seating System. All rights reserved.</p>
    </footer>

    <script>
        // Fetch rooms data from backend
        document.addEventListener("DOMContentLoaded", function () {
            fetchRooms();
        });

        function fetchRooms() {
            fetch('http://localhost:3000/api/rooms')
                .then(response => response.json())
                .then(rooms => {
                    const roomsTable = document.getElementById("roomsTable").getElementsByTagName("tbody")[0];
                    roomsTable.innerHTML = '';  // Clear table before adding rows
                    rooms.forEach(room => {
                        const row = roomsTable.insertRow();
                        row.innerHTML = `
                            <td>${room.room_code}</td>
                            <td>${room.name}</td>
                            <td>${room.capacity}</td>
                            <td>${room.status}</td>
                        `;
                    });
                })
                .catch(error => console.error('Error fetching room data:', error));
        }
    </script>

</body>
</html>
