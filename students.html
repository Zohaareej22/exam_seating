<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Exam Seating Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Exam Seating Management System</h1>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="departments.html">Departments</a></li>
            <li><a href="students.html" class="active">Students</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="seating-plan.html">Seating Plan</a></li>
            <li><a href="export.html">Export</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <section class="page-content">
            <h2>Manage Students</h2>
            
            <!-- Add Student button -->
            <button id="addStudentBtn">Add Student</button>

            <!-- Add/Edit Student Modal -->
            <div id="studentModal" class="modal">
                <div class="modal-content">
                    <h2 id="modalTitle">Add Student</h2>
                    <form id="studentForm">
                        <label for="rollNumber">Roll Number</label>
                        <input type="text" id="rollNumber" name="rollNumber" required>

                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>

                        <button type="submit" id="submitBtn">Add Student</button>
                        <button type="button" id="cancelBtn">Cancel</button>
                    </form>
                </div>
            </div>

            <!-- Table for Students (Email column removed) -->
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Students rows will be dynamically populated here -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Exam Seating System. All rights reserved.</p>
    </footer>

    <script>
        // Fetch students data from backend
        document.addEventListener("DOMContentLoaded", function () {
            fetchStudents();
        });

        function fetchStudents() {
            fetch('http://localhost:3000/api/students')
                .then(response => response.json())
                .then(students => {
                    const studentsTable = document.getElementById("studentsTable").getElementsByTagName("tbody")[0];
                    studentsTable.innerHTML = '';  // Clear table before adding rows
                    students.forEach(student => {
                        const row = studentsTable.insertRow();
                        row.innerHTML = `
                            <td>${student.roll_no}</td>
                            <td>${student.full_name}</td>
                            <td>
                                <button onclick="editStudent(${student.id})">Edit</button>
                                <button onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        `;
                    });
                })
                .catch(error => console.error('Error fetching student data:', error));
        }

        // Show the modal to add a new student
        document.getElementById("addStudentBtn").addEventListener("click", function () {
            clearModal();
            document.getElementById("modalTitle").textContent = "Add Student";
            document.getElementById("studentModal").style.display = "block";
        });

        // Close the modal
        document.getElementById("cancelBtn").addEventListener("click", function () {
            document.getElementById("studentModal").style.display = "none";
        });

        // Add a new student
        document.getElementById("studentForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const studentData = {
                rollNumber: document.getElementById("rollNumber").value,
                name: document.getElementById("name").value
            };

            fetch('http://localhost:3000/api/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentData)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Student added:', data);
                document.getElementById("studentModal").style.display = "none";
                fetchStudents();
            })
            .catch(error => console.error('Error adding student:', error));
        });

        // Edit a student
        function editStudent(id) {
            fetch(`http://localhost:3000/api/students/${id}`)
                .then(response => response.json())
                .then(student => {
                    document.getElementById("rollNumber").value = student.roll_no;
                    document.getElementById("name").value = student.full_name;

                    document.getElementById("modalTitle").textContent = "Edit Student";
                    document.getElementById("submitBtn").textContent = "Update Student";

                    document.getElementById("studentForm").onsubmit = function (e) {
                        e.preventDefault();

                        const studentData = {
                            rollNumber: document.getElementById("rollNumber").value,
                            name: document.getElementById("name").value
                        };

                        fetch(`http://localhost:3000/api/students/${id}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(studentData)
                        })
                        .then(response => response.json())
                        .then(data => {
                            console.log('Student updated:', data);
                            document.getElementById("studentModal").style.display = "none";
                            fetchStudents();
                        })
                        .catch(error => console.error('Error updating student:', error));
                    };

                    document.getElementById("studentModal").style.display = "block";
                })
                .catch(error => console.error('Error fetching student data:', error));
        }

        // Delete a student
        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                fetch(`http://localhost:3000/api/students/${id}`, {
                    method: 'DELETE',
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Student deleted:', data);
                    fetchStudents();
                })
                .catch(error => console.error('Error deleting student:', error));
            }
        }

        // Clear modal fields
        function clearModal() {
            document.getElementById("rollNumber").value = '';
            document.getElementById("name").value = '';
        }
    </script>

</body>
</html>
