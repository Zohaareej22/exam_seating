<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seating Plan | Exam Seating Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Exam Seating Management System</h1>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="departments.html">Departments</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="seating-plan.html" class="active">Seating Plan</a></li>
            <li><a href="export.html">Export</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <section class="page-content">
            <h2>Generate Seating Plan</h2>

            <form id="generateSeatingPlanForm">
                <div class="form-group">
                    <label for="examSelect">Select Exam</label>
                    <select id="examSelect" name="exam" required>
                        <!-- Options will be dynamically loaded here -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="roomSelect">Select Room</label>
                    <select id="roomSelect" name="room" required>
                        <!-- Options will be dynamically loaded here -->
                    </select>
                </div>

                <button type="submit">Generate Plan</button>
                <button type="button" id="autoAllocateBtn">Auto Allocate All</button>
            </form>

            <h3>Room Seating Grid - Preview</h3>
            <div id="seatingGrid">
                <!-- Seating grid preview here -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Exam Seating System. All rights reserved.</p>
    </footer>

    <script>
        // Fetch Exam data from backend
        document.addEventListener('DOMContentLoaded', () => {
            fetchExams();
            fetchRooms();
        });

        function fetchExams() {
            fetch("http://localhost:3000/api/exams")
                .then(response => response.json())
                .then(data => {
                    const examSelect = document.getElementById('examSelect');
                    data.forEach(exam => {
                        examSelect.append(new Option(exam.name, exam.id));
                    });
                })
                .catch(error => console.error('Error fetching exams:', error));
        }

        function fetchRooms() {
            fetch("http://localhost:3000/api/rooms")
                .then(response => response.json())
                .then(data => {
                    const roomSelect = document.getElementById('roomSelect');
                    data.forEach(room => {
                        roomSelect.append(new Option(room.name, room.id));
                    });
                })
                .catch(error => console.error('Error fetching rooms:', error));
        }

        // Handle the form submission to generate the seating plan
        document.getElementById('generateSeatingPlanForm').addEventListener('submit', (event) => {
            event.preventDefault();
            const examId = document.getElementById('examSelect').value;
            const roomId = document.getElementById('roomSelect').value;

            fetch(`http://localhost:3000/api/seating-plan?examId=${examId}&roomId=${roomId}`)
                .then(response => response.json())
                .then(data => {
                    const seatingGrid = document.getElementById('seatingGrid');
                    seatingGrid.innerHTML = ''; // Clear the existing grid
                    data.seats.forEach(seat => {
                        const seatElement = document.createElement('div');
                        seatElement.classList.add('seat');
                        seatElement.textContent = seat.studentName;
                        seatingGrid.appendChild(seatElement);
                    });
                })
                .catch(error => console.error('Error generating seating plan:', error));
        });

        // Auto Allocate all seats (dummy function for now)
        document.getElementById('autoAllocateBtn').addEventListener('click', () => {
            alert('Auto allocation feature is under development!');
        });
    </script>

</body>
</html>
