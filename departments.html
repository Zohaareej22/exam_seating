<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments | Exam Seating Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Exam Seating Management System</h1>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="departments.html" class="active">Departments</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="seating-plan.html">Seating Plan</a></li>
            <li><a href="export.html">Export</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <section class="page-content">
            <h2>Manage Departments</h2>
            <table id="departmentsTable">
                <thead>
                    <tr>
                        <th>Department Name</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be dynamically loaded here -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Exam Seating System. All rights reserved.</p>
    </footer>

    <script>
        // Fetch department data from backend
        document.addEventListener("DOMContentLoaded", function () {
            fetch("http://localhost:3000/api/departments")
                .then(response => response.json())
                .then(departments => {
                    const departmentsTable = document.getElementById("departmentsTable").getElementsByTagName("tbody")[0];
                    departments.forEach(department => {
                        const row = departmentsTable.insertRow();
                        row.innerHTML = `<td>${department.name}</td>`;
                    });
                })
                .catch(error => console.error("Error fetching departments:", error));
        });
    </script>

</body>
</html>
